[project]
name = "wtpm-web"
version = "0.1.0"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "de-core-news-sm",
    "de-dep-news-trf",
    "spacy>=3.8.18",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wtpm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.uv.sources]
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }
de-dep-news-trf = { url = "https://github.com/explosion/spacy-models/releases/download/de_dep_news_trf-3.8.0/de_dep_news_trf-3.8.0-py3-none-any.whl" }
